apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ required "gitops.repoURL is required" .Values.gitops.repoURL | quote }}
    targetRevision: {{ .Values.gitops.targetRevision | quote }}
    path: gitops/bootstrap/charts/argo-rollouts
    helm:
      valueFiles:
        - ../../values/argo-rollouts.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
