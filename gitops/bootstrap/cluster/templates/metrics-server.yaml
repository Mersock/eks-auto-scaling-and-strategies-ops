apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ required "gitops.repoURL is required" .Values.gitops.repoURL | quote }}
    targetRevision: {{ .Values.gitops.targetRevision | quote }}
    path: gitops/bootstrap/charts/metrics-server
    helm:
      valueFiles:
        - ../../values/metrics-server.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
