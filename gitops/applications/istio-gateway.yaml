apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/Mersock/eks-auto-scaling-and-strategies-ops.git
    targetRevision: main
    path: gitops/charts/gateway
    helm:
      releaseName: istio-ingressgateway
      valueFiles:
        - ../../platform/istio/gateway-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
