apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/Mersock/eks-auto-scaling-and-strategies-ops.git
    targetRevision: main
    path: gitops/charts/metrics-server
    helm:
      releaseName: metrics-server
      valueFiles:
        - ../../platform/metrics-server/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
